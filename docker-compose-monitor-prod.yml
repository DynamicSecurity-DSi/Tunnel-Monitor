# docker-compose-monitor-prod.yml
# Production deployment for the tunnel monitor.
# Based on docker-compose-tunnel-monitor.yml, tuned for long-running production use:
#   - mounts the production config (config-prod.json) read-only as /app/config.json
#   - json-file log rotation so the container log cannot fill the host disk
#   - host networking so the monitor can reach tunnel / Twingate connector IPs directly
#
# Deploy:  docker compose -f docker-compose-monitor-prod.yml up -d --build
# Logs:    docker logs -f tunnel-monitor
version: "3.8"

services:
  tunnel-monitor:
    image: tunnel-monitor:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tunnel-monitor
    restart: unless-stopped
    network_mode: host          # required — monitor must reach tunnel IPs directly
    volumes:
      - ./config-prod.json:/app/config.json:ro
      - tunnel-monitor-logs:/var/log
    environment:
      - CONFIG_PATH=/app/config.json
      - LOG_FILE=/var/log/tunnel-monitor.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  tunnel-monitor-logs:
